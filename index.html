<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AMC Transportergroep – Personeelsvervoer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <h1>AMC Transportergroep</h1>
    <p>Personeelsvervoer aanvragen en beheren</p>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h2>Rit aanvragen</h2>
    <form id="requestForm">
      <label>Naam
        <input id="name" required maxlength="80" placeholder="Voor- en achternaam">
      </label>
      <label>Datum
        <input id="date" type="date" required>
      </label>
      <label>Locatie
        <select id="location" required>
          <option value="">Kies een locatie</option>
        </select>
      </label>
      <label>Tijd
        <select id="time" required>
          <option value="">Kies een vast tijdslot</option>
        </select>
      </label>
      <button type="submit">Aanvraag indienen</button>
    </form>
    <p id="formMessage" class="message"></p>
  </section>

  <section class="card">
    <h2>Beheer</h2>
    <p class="muted">Deze demo bewaart aanvragen lokaal in deze browser. Voor echte gedeelde administratie, accounts en WhatsApp is een backend nodig.</p>
    <div class="toolbar">
      <button id="clearAll" class="danger">Alle lokale aanvragen wissen</button>
    </div>
    <div id="requests"></div>
  </section>

  <section class="card">
    <h2>Bussen</h2>
    <div id="buses"></div>
    <button id="addBus" type="button">+ Bus toevoegen</button>
  </section>
</main>

<footer><div class="wrap">AMC Transportergroep</div></footer>
<script src="app.js"></script>
</body>
</html>
