<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Personeelsvervoer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div><h1 data-i18n="title">Personeelsvervoer</h1><p data-i18n="subtitle">Eenvoudig aanmelden voor personeelsvervoer</p></div>
  <select id="language" aria-label="Taal">
    <option value="nl">🇳🇱 Nederlands</option><option value="es">🇪🇸 Español</option><option value="en">🇬🇧 English</option>
  </select>
</header>
<nav class="nav"><button class="tab active" data-target="signup" data-i18n="signupTab">Aanmelden</button><button class="tab" data-target="adminLogin" data-i18n="adminTab">Beheer</button></nav>
<main>
<section id="signup" class="card section">
  <h2 data-i18n="signupTitle">Aanmelden voor vervoer</h2>
  <form id="signupForm">
    <label><span data-i18n="name">Naam</span><input id="name" required></label>
    <label><span data-i18n="phone">Telefoonnummer</span><input id="phone" type="tel" required></label>
    <label><span data-i18n="date">Datum</span><input id="date" type="date" required></label>
    <label><span data-i18n="pickup">Ophaallocatie</span><select id="location" required></select></label>
    <label><span data-i18n="worktime">Werktijd</span><select id="time" required></select></label>
    <button class="primary" type="submit" data-i18n="register">Aanmelden</button>
    <div id="message" class="message"></div>
  </form>
</section>
<section id="adminLogin" class="card section hidden">
  <h2 data-i18n="adminLoginTitle">Beheer</h2>
  <p data-i18n="adminHint">Alleen voor beheerders.</p>
  <form id="loginForm"><label><span data-i18n="password">Wachtwoord</span><input id="password" type="password" required></label><button class="primary" type="submit" data-i18n="login">Inloggen</button></form>
  <p class="hint" data-i18n="demo">Demo-wachtwoord: beheer123</p><div id="loginMessage" class="message"></div>
</section>
<section id="admin" class="hidden">
  <div class="card">
    <div class="adminHead"><div><h2 data-i18n="overview">Overzicht aanmeldingen</h2><p data-i18n="phoneAdmin">Telefoonnummers zijn alleen zichtbaar voor de beheerder.</p></div><button id="logout" class="secondary" data-i18n="logout">Uitloggen</button></div>
    <div class="filters"><input id="filterName" data-i18n-placeholder="searchName" placeholder="Zoek op naam"><input id="filterDate" type="date"><select id="filterLocation"></select><select id="filterTime"></select></div>
    <div class="tableWrap"><table><thead><tr><th data-i18n="date">Datum</th><th data-i18n="name">Naam</th><th data-i18n="pickup">Ophaallocatie</th><th data-i18n="worktime">Werktijd</th><th data-i18n="phone">Telefoon</th><th>WhatsApp</th><th data-i18n="delete">Verwijderen</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
