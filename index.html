<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMC-Transportergroep</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>AMC-Transportergroep</h1>
      <p>Medewerkersvervoer voor bedrijven</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Rit aanvragen</h2>
      <p>Vul hieronder de gegevens van het medewerkersvervoer in.</p>

      <form id="ritForm">
        <label for="naam">Naam</label>
        <input id="naam" name="naam" type="text" placeholder="Uw naam" required>

        <label for="bedrijf">Bedrijf</label>
        <input id="bedrijf" name="bedrijf" type="text" placeholder="Naam van het bedrijf" required>

        <label for="vertrek">Vertreklocatie</label>
        <input id="vertrek" name="vertrek" type="text" placeholder="Bijv. Stationsplein 1, Vlissingen" required>

        <label for="bestemming">Bestemmingslocatie</label>
        <input id="bestemming" name="bestemming" type="text" placeholder="Bijv. Bedrijventerrein" required>

        <div class="two">
          <div>
            <label for="datum">Datum</label>
            <input id="datum" name="datum" type="date" required>
          </div>
          <div>
            <label for="tijd">Tijd</label>
            <input id="tijd" name="tijd" type="time" required>
          </div>
        </div>

        <label for="aantal">Aantal medewerkers</label>
        <input id="aantal" name="aantal" type="number" min="1" placeholder="Bijv. 8" required>

        <label for="opmerking">Opmerking</label>
        <textarea id="opmerking" name="opmerking" placeholder="Extra informatie (optioneel)"></textarea>

        <button type="submit">Rit aanvragen</button>
      </form>

      <div id="melding" class="melding"></div>
    </section>
  </main>

  <footer>
    <div class="container">AMC-Transportergroep</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
